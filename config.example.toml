# ALPS Configuration File Example
#
# Copy this file to config.toml, edit it, and start ALPS with
# -config config.toml. docs/CONFIGURATION.md describes every key.
#
# ALPS ignores keys and sections it does not know, and logs a warning at
# startup naming each one, such as
# "Unknown configuration key: server.write_timeout (ignored)". A misspelled
# key therefore keeps its default. Check names against this file.

[server]
# Server listening address (default: ":1323")
addr = ":1323"

# Debug mode (default: false). For development only.
# With debug = true, the default log level becomes "debug" and the default
# format "console" (where [logging] does not set them), and TLS handshake
# errors are logged at debug level. It also turns on protocol traces, logged
# through [logging] as "protocol trace" lines at debug level: the IMAP
# exchange, every CardDAV and CalDAV request and response, and the ManageSieve
# exchange. They appear only while the log level is "debug", so not with the
# level = "info" this example sets in [logging]. Message, contact and calendar
# content is included (passwords, and the HTTP Authorization and cookie
# headers, are redacted).
debug = false

# Addresses or CIDR blocks of your own reverse proxies (default: none; a bare
# address counts as /32 or /128, and an invalid entry stops startup).
# Only when a request comes from one of them does ALPS read the forwarded
# headers: the client address from X-Forwarded-For (or X-Real-IP), which the
# rate limits and the logs use, and the scheme and host from X-Forwarded-Proto
# and X-Forwarded-Host, which the CSRF origin check and the cookies' Secure
# flag use. This list decides whose word ALPS takes for the client's address,
# and so keeps the per-address rate limits counting each real client: list
# only proxies you run. List every proxy hop in front of ALPS as well, since
# the first unlisted hop is taken for the client. This is the recommended way
# to run ALPS behind a TLS-terminating reverse proxy (proxy speaks HTTPS to the
# browser, HTTP to ALPS).
# trusted_proxies = ["127.0.0.1/32", "::1/128", "10.0.0.0/8"]

# Additional origins accepted by the CSRF check, in addition to the one ALPS computes
# from the request (or from the forwarded headers above). Use this when your proxy does
# not (or cannot) set X-Forwarded-Proto/Host, or as an explicit override. The browser's
# Origin header must match one of these exactly (scheme + host [+ port]).
# trusted_origins = ["https://webmail.example.com"]

# Fernet key for login persistence (optional, default: none)
# Encrypts the user's credentials into the alps_login_token cookie, so that a
# session the server has lost (after a restart, for one) can be restored
# without a new sign-in, and "Stay signed in after closing the browser" can
# keep a sign-in for up to 30 days (see docs/SESSIONS.md). Without it, no
# login token is issued and no session is restored. A login token is accepted
# for at most 30 days after it was issued. An invalid key stops startup.
# login_key is also required for linked accounts: without it, linking an
# account is refused, because the linked accounts' passwords are stored
# encrypted with this key. In the same way it encrypts the separate CalDAV and
# CardDAV passwords users save in Settings (see docs/CDAV.md): without it, a
# user's calendar and contacts connection can only use the mail username and
# password.
# Every node serving the same hostname must use the same login_key.
# Generate with: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# login_key = "your-fernet-key-here"
#
# Security note: Rotating the login_key signs everyone out, every linked
# account must then be linked again, and users must enter their separate
# CalDAV and CardDAV passwords again. Use it to invalidate all persisted
# credentials during security incidents or when you suspect credential
# compromise.

# Private personal CalDAV and CardDAV servers (default: false)
# The CalDAV and CardDAV servers that users enter in Settings are reached over
# HTTPS only, and only at public addresses, so that a mail account cannot make
# ALPS connect into the network it runs in. Set this to true to also allow the
# +insecure (plain HTTP) schemes and loopback or private addresses, for
# example when your users keep their own DAV servers on a trusted intranet.
# Servers configured in this file are never restricted. See docs/CDAV.md.
# dav_allow_private_servers = false

# Temporary directory (optional, default: $TMPDIR, otherwise /tmp)
# ALPS sets TMPDIR to it for its own process at startup. It holds the files of
# attachment uploads and the BIMI logo cache (alps-avatars). Create it before
# starting ALPS, writable only by the user ALPS runs as: until it exists, every
# upload whose files add up to more than 32 KiB is refused with 500
# (upload_storage_failed). Under the shipped systemd unit (dist/alps.service),
# PrivateTmp gives ALPS a /tmp of its own, so a directory under the host's
# /tmp does not exist for it; there, leave temp_dir unset, or point it outside
# /tmp and /var/tmp and list it in ReadWritePaths. See docs/OPERATIONS.md
# (section 3, "The Temp Directory").
# temp_dir = "/var/lib/alps/tmp"

# Session idle timeout in minutes (default: 30; 0 or a negative value keeps it)
# How long the server keeps a session without requests, for an account whose
# saved settings hold no auto-logout time. It does not change what the page
# does: for such an account, Settings shows an auto-logout of 30 minutes, the
# page signs the user out after 30 minutes without activity in the browser,
# and saving any setting stores those 30 minutes as the account's own choice.
# In practice it applies only to accounts that have never saved their
# settings. See docs/SESSIONS.md.
# session_minutes = 30

# Cap on the auto-logout a user may choose, in minutes (default: 0, no cap;
# a negative value means no cap too)
# A user's choice in Settings above it, "Never" included, is lowered to it
# (1440 caps it at 24 hours). Without it, "Never" means no idle timeout in
# practice (a year), and only absolute_session_hours ends the session. It does
# not cap session_minutes.
# max_session_minutes = 0

# Absolute session lifetime in hours (default: 168, i.e., 7 days)
# A hard limit on a session's total life, however active it is.
#
# The two settings above bound INACTIVITY only: every request resets the idle
# window, and a page left open keeps making requests of its own, its checks for
# new mail among them. Without this limit a session that keeps being used
# never ends, and its user is never asked to sign in again.
#
# Floored at session_minutes, so a value below the idle window cannot silently
# redefine it. 0 keeps the default. Set to -1 (any negative value) to remove
# the limit.
# absolute_session_hours = 168

# HTTP Server Timeouts
# They bound how long one client connection can hold the server's resources.
# 0 or a negative value keeps a timeout's default.

# HTTP read timeout in seconds (default: 10)
# Maximum time allowed to read the entire HTTP request (headers + body), so an
# attachment upload must finish within it. On HTTP/1.1, a request whose
# handler is still running when this time passes is cancelled; its mail
# operation then gets up to 10 more seconds before the session's mail
# connection is let go. Raise it for slow links or large uploads. The event
# stream (GET /events) lifts it for itself.
read_timeout_sec = 10

# HTTP write timeout in seconds (default: 60)
# Time from the end of the request headers until the response has been
# written, so it governs downloads and long responses. An upload's body is
# bounded by read_timeout_sec, and its response must still be written within
# this time, so keep it at least as long as read_timeout_sec. This example
# sets 30, below the default.
write_timeout_sec = 30

# HTTP idle timeout in seconds (default: 120)
# Maximum time to wait for the next request when using HTTP keep-alive connections
# Applies between requests, not during active transfers
idle_timeout_sec = 120

# IMAP timeout in seconds: set it as [provider] timeout_sec (see below).
# imap_timeout_sec is another name for that key, read only with [provider]
# type = "imap" and only when timeout_sec is unset (or 0); it then governs
# exactly what timeout_sec does. With type = "multi" or "maildir" it is
# ignored.
# imap_timeout_sec = 30

# SMTP timeout in seconds (default: 30)
# Bounds connecting (the TCP connect, with the TLS handshake for smtps://),
# then for smtp:// the greeting, EHLO and STARTTLS together, and after that
# each SMTP command and the wait after the message data.
smtp_timeout_sec = 30

# Example configurations for different deployment scenarios
# (timeout_sec goes in the [provider] section):
#
# Fast network, small mailboxes:
#   read_timeout_sec = 5
#   write_timeout_sec = 15
#   smtp_timeout_sec = 15
#   [provider] timeout_sec = 15
#
# Standard (recommended for most deployments, and what this file sets; the
# built-in write_timeout_sec is 60):
#   read_timeout_sec = 10
#   write_timeout_sec = 30
#   smtp_timeout_sec = 30
#   [provider] timeout_sec = 30
#
# Slow network or large attachments:
#   read_timeout_sec = 30
#   write_timeout_sec = 120
#   smtp_timeout_sec = 60
#   [provider] timeout_sec = 60

# Session Limits
# Bound the number of concurrent sessions on this node, and so the memory and
# mail connections they hold.

# Maximum total concurrent sessions globally (default: 10000)
# 0 keeps the default, and a negative value, such as -1, turns the global
# limit off. When it is reached, the session used least recently is ended to
# make room.
max_sessions = 10000

# Maximum concurrent sessions per user (default: 10)
# 0 keeps the default, and a negative value, such as -1, turns the per-user
# limit off. It keeps one account from holding more sessions than this. When
# it is reached, that user's session used least recently is ended.
max_sessions_per_user = 10

# Example configurations for different deployment sizes:
#
# Small deployment (< 100 users):
#   max_sessions = 1000
#   max_sessions_per_user = 5
#
# Medium deployment (100-1000 users):
#   max_sessions = 10000
#   max_sessions_per_user = 10
#
# Large deployment (> 1000 users):
#   max_sessions = 50000
#   max_sessions_per_user = 20

# Background mail connection (default: true)
# Each session opens a second connection to the mail server, when it is first
# needed, for the work the user is not waiting for: checks for new mail, sender
# verdicts, the search of Sent for a conversation's replies, draft saves, and the
# messages a conversation reads ahead. It is closed once it has gone unused for
# a minute. A session opens no more than this one beside its own, so a user's
# sessions together hold up to twice max_sessions_per_user. Mail servers limit
# the connections of one user from one address (Dovecot:
# mail_max_userip_connections = 10), and every session comes from ALPS's
# address. A server that will not open the second connection costs only speed:
# the work then runs on the session's own connection. Set to false to keep one
# connection per session. docs/CONFIGURATION.md (section 1.2) has the details.
# background_connection = true

# Push new mail (default: false)
# Pages check for new mail at the user's check-mail interval. With this on, a
# session also waits in IMAP IDLE on its background connection while a mail
# page is open, and tells the page over an event stream (GET /events) as soon
# as a message arrives in the Inbox or leaves it. Needs background_connection,
# a mail server with IDLE, and a browser in a secure context (HTTPS, or
# localhost); a deployment served over plain HTTP gets no push.
# The cost is on the mail server: every session with a mail page open holds
# two connections (its own and the background one in IDLE), all from ALPS's
# one address, so check the server's per-user and per-address connection
# limits.
# A reverse proxy must not buffer /events and must let it stay open; ALPS
# writes a heartbeat every 20 seconds. In a cluster the stream must reach the
# node that holds the session. docs/CONFIGURATION.md (section 1.4, "Pushing new
# mail") has what it costs and what a proxy must allow.
# push_new_mail = false

# Have the mail server number its changes (default: false)
# With this on, each mail connection turns on IMAP CONDSTORE (RFC 7162) where
# the server lists it, and a cached page of a folder whose messages are all
# still there has only the flags that changed read again (one FETCH with
# CHANGEDSINCE), so a star or a read made in another client is listed at the
# next check. A server that does not list CONDSTORE is used as with
# condstore = false, and QRESYNC is never turned on. It costs a round trip as
# each connection signs in. docs/CONFIGURATION.md (section 1.5, "Numbered
# changes") has the details.
# condstore = false

# Push the subscribed folders too (default: false)
# With push_new_mail on and a mail server with NOTIFY (RFC 5465), a session also
# asks, on the same background connection, for the news of the subscribed
# folders, and pushes it as it pushes the Inbox's. While the folders are pushed,
# the pages' own checks run a third as often (every 15 minutes at the default
# 5). Without NOTIFY, or where it is refused, the Inbox alone is pushed. No
# connection is added, but the mail server does more for each open page (see
# docs/CONFIGURATION.md, section 1.4).
# push_subscribed_folders = false

# Attachment limits. See docs/ATTACHMENTS.md.
# An upload is refused when it would take its own composer over
# max_attachment_mib, when the files of one request are together larger than
# any of the three limits, or when, over the session or the global limit,
# nothing is left to drop.

# Max attachment size per composer in MiB (default: 32)
# Limits the attachments of a single email being composed
# max_attachment_mib = 32

# Max attachment size per session in MiB (default: 128)
# When an upload would take the session over it, the session's oldest uploaded
# attachments, from any of its composers, are dropped until it fits.
# max_session_attachment_mib = 128

# Max global attachment size in MiB (default: 1024)
# When an upload would take the server over it, the oldest uploaded
# attachments across all sessions, other users' included, are dropped first.
# max_global_attachment_mib = 1024

# Rate Limiting Configuration
# Limits how often passwords and recovery codes can be tried. These limits
# apply to sign-ins and to every other check of an account's password or
# recovery code: linking an account, the current-password check before a
# password change, password confirmations in the two-factor settings, and
# recovery codes. All of them share the same per-address and per-account
# budget.
# Each limit must be a positive number: 0 or a negative value keeps that
# limit's default, so a single tier cannot be switched off. Only
# enabled = false turns rate limiting off, all tiers at once.
# An attempt the limits refuse is not counted. An attempt that ends in a mail
# server error, rather than in an answer to the credentials, counts towards
# the global and per-minute limits only.
# Without [cluster], each node keeps its own counts. See docs/RATELIMIT.md.
[server.rate_limit]
# Enable rate limiting (default: true)
# Set to false to disable all rate limiting (not recommended for production)
enabled = true

# Per-IP rate limits
# Maximum attempts from a single IP address per minute, counting every attempt:
# successful, failed or ended in an error (default: 5)
ip_requests_per_minute = 5

# Maximum FAILED sign-ins (credentials refused) from a single IP address per
# hour (default: 20). Successful attempts and errors are not counted.
# Once it is reached, the address's next attempt is refused and locks the
# address out for lockout_minutes. A successful sign-in from the address
# resets the count.
ip_requests_per_hour = 20

# Per-username rate limits
# A successful sign-in to the account resets both counts.
# Maximum failed sign-ins for one account per 15 minutes (default: 5)
# Once it is reached, the account's attempts are refused, with a wait of 15
# minutes, until its count drops below it.
username_fails_per_quarter = 5

# Maximum failed sign-ins for one account per hour (default: 10)
# Once it is reached, the account's next attempt is refused and locks the
# account out for lockout_minutes.
username_fails_per_hour = 10

# Global rate limit
# Maximum attempts per second across all accounts and addresses
# (default: 100): those this node recorded in the last second, successful,
# failed or ended in an error, together with those the other nodes reported
# under [cluster]. Once it is reached, further attempts from anyone are
# refused as "server busy", with a wait of one second.
global_requests_per_second = 100

# Lockout duration in minutes (default: 15)
# How long an IP or username is blocked after reaching an hourly limit. The
# per-minute and per-15-minute limits lock nothing: they refuse with a wait.
lockout_minutes = 15

# Example configurations for different security postures:
#
# Strict (high security, may impact legitimate users):
#   ip_requests_per_minute = 3
#   ip_requests_per_hour = 10
#   username_fails_per_quarter = 3
#   username_fails_per_hour = 5
#   lockout_minutes = 30
#
# Standard (balanced, recommended for most deployments):
#   ip_requests_per_minute = 5
#   ip_requests_per_hour = 20
#   username_fails_per_quarter = 5
#   username_fails_per_hour = 10
#   lockout_minutes = 15
#
# Relaxed (lower security, better user experience):
#   ip_requests_per_minute = 10
#   ip_requests_per_hour = 40
#   username_fails_per_quarter = 10
#   username_fails_per_hour = 20
#   lockout_minutes = 5


[cache]
# Cache time-to-live in minutes (default: 10)
# How long cached data stays valid before expiring
ttl_minutes = 10

# Enable caching (default: true)
# Set to false to disable all caching (not recommended)
enabled = true

# The largest message part kept in the cache, in KiB (default: 1024)
# A part above it, a large attachment most often, is read from the mail server
# again each time it is asked for, rather than held in memory for the life of
# the cache entry. The browser keeps its own copy, which it revalidates
# without the part being read again.
# max_part_kib = 1024

[logging]
# Messages from TLS certificate management (Let's Encrypt), from the cluster
# and from the IMAP provider follow output, format and level like every other
# line, and so do the protocol traces of server.debug (see debug above), at
# debug level. Only the errors printed before the log is opened do not go
# through [logging].

# Log output destination
# Options:
#   "stdout"  - Write logs to standard output (default)
#   "stderr"  - Write logs to standard error
#   "syslog"  - Send logs to system syslog daemon
#   "/path/to/file.log" - Write logs to a file (path can be absolute or relative).
#                         ALPS reopens the file on SIGHUP, for newsyslog/logrotate.
# If syslog or the file cannot be opened, logs go to stderr.
#
# Default: "stdout", whether or not format or level is set. This example sets
# "stderr".
#
# Examples:
#   output = "stdout"
#   output = "stderr"
#   output = "syslog"
#   output = "/var/log/alps/alps.log"
#   output = "./logs/alps.log"
output = "stderr"

# Log format
# Options:
#   "json"    - Structured JSON logs for machine parsing (default)
#   "console" - Human-readable text format (default when server.debug = true)
# Any value other than "json" gives the text format.
#
# JSON example output:
#   {"time":"2025-10-21T10:30:45Z","level":"INFO","msg":"Starting server on :1323"}
# Console example output:
#   time=2025-10-21T10:30:45.000Z level=INFO msg="Starting server on :1323"
format = "console"

# Log level
# Options:
#   "debug" - Most verbose, includes all log messages
#   "info"  - Standard operational messages (default)
#   "warn"  - Warnings and errors (also "warning")
#   "error" - Errors only (least verbose)
# Values are case-insensitive, and an unknown value means "info".
#
# Note: When server.debug = true, the level defaults to "debug". The
# protocol traces of server.debug and [provider.imap] debug are logged at
# debug level, so this example's "info" leaves them out.
level = "info"

# Log every request at info level (default: true): method, path (without the
# query string), status, bytes, duration, client IP and, once signed in, the
# user and a session ID derived from the session token (never the token).
# Sign-ins, failed sign-ins, account switches and session ends are logged at
# info/warn whatever this says. Turn it off when a reverse proxy already keeps
# an access log and the per-request lines are noise.
# access = true

[webauthn]
# WebAuthn Configuration for Two-Factor Authentication (2FA)
# Required for WebAuthn to work in production environments. Security keys work
# only when rpid and origins match the hostname users reach ALPS at, so set
# both to it. Each key falls back to its default on its own, and ALPS logs a
# warning at startup when rpid is unset. See docs/WEBAUTHN.md.

# The Relying Party ID (usually your domain name) (default: "localhost")
# rpid = "webmail.example.com"

# The display name shown to users during authentication
# (default: "Alps Webmail")
# display_name = "Alps Webmail"

# Allowed origins for WebAuthn requests
# (default: ["http://localhost:1323", "http://localhost:5173"])
# Must include the exact scheme (https://) and no trailing slash
# origins = ["https://webmail.example.com"]

[branding]
# What a deployment changes about how the webmail looks. Left out, it looks
# as it ships.

# Colour theme for anyone who has not picked one: "alps" (default), "migadu",
# "nord" or "ocean" (case-insensitive; any other value stops startup). A theme
# picked in Settings stays that user's.
# default_theme = "alps"

# The logo in the edelweiss's place, on the sign-in page and in the header,
# and the icon of the browser tab and the home screen. A logo ALPS ships, by
# name (case-insensitive): "migadu" (the Migadu mammoth, in the theme's
# colours), or "alps" for the edelweiss. Or the path of a folder holding a
# favicon package, the files RealFaviconGenerator writes: all six of
# favicon.svg, favicon-96x96.png, favicon.ico, apple-touch-icon.png,
# web-app-manifest-192x192.png and web-app-manifest-512x512.png, each at most
# 1 MiB. A missing, larger or unreadable file, or a value that is neither a
# built-in name nor a folder, stops startup. A relative path is taken from the
# directory ALPS runs in. Defaults to the default theme's own logo, so
# default_theme = "migadu" brings the Migadu logo.
# logo = "migadu"


[tls]
# Enable TLS termination (default: false)
# enabled = false

# TLS Provider ("file" or "letsencrypt"; no default)
# Required with enabled = true. Any other value, or none, stops startup
# ("unsupported tls provider"). See docs/TLS.md.
# provider = "file"

# Path to TLS certificate (required if provider="file")
# cert_file = "/path/to/cert.pem"

# Path to TLS private key (required if provider="file")
# key_file = "/path/to/key.pem"

# With provider = "file", cert_file and key_file are read once, at startup.
# Restart ALPS after renewing the certificate (SIGHUP only reopens the log
# file). The minimum TLS version is 1.2.

[tls.letsencrypt]
# Email address for ACME registration (required)
# email = "admin@example.com"

# Domains to obtain certificates for (required)
# domains = ["mail.example.com", "webmail.example.com"]

# Default domain for SNI-less connections (optional, default: the first entry
# of domains)
# default_domain = "mail.example.com"

# Storage provider for certificates: "s3" (default) or "file"
# With "s3", the [tls.letsencrypt.s3] bucket must be reachable at startup, and
# cache_dir holds a local copy of the certificates. With "file", certificates
# are kept only in cache_dir, for a single node. Any other value stops
# startup. A cluster requires "s3".
# storage_provider = "s3"

# Local cache directory for certificates (default: "cert-cache")
# Used as fallback cache when using s3, or as main cache when using file provider
# cache_dir = "cert-cache"

# How often, in minutes, a node uploads to S3 the certificates it could store
# only in cache_dir while S3 was failing (default: 5). A check with nothing
# waiting for upload does nothing. Zero or a negative value means 5.
# Used only with "s3". See docs/TLS.md.
# sync_interval_minutes = 5

# Address for HTTP-01 challenge handler (default: ":80")
# Change this if running behind a proxy that already uses port 80.
# Your proxy should forward /.well-known/acme-challenge/* to this address.
# acme_http_addr = ":8080"

# ACME directory URL (default: Let's Encrypt production).
# Set to the Let's Encrypt staging directory to test certificate issuance
# without burning production rate limits:
#   directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"
# When a non-production directory is configured, the local cache directory and
# S3 prefix are automatically namespaced (suffix derived from the URL) so
# staging certificates can never be served from, or overwrite, the production
# certificate store.
# directory_url = ""

# Also pre-issue an RSA certificate alongside the ECDSA one (default: false).
# Only needed if you must support very old clients that cannot do ECDSA;
# doubles the number of certificates issued per domain. Each warm pass makes
# sure every domain has an ECDSA certificate, so a domain whose cache holds
# only an RSA certificate gets an ECDSA one at the next pass.
# warm_rsa_certs = false

[tls.letsencrypt.s3]
# S3 storage configuration for certificates
# Uses autocert with S3 storage as the primary source of truth.

# S3 endpoint (required if using custom S3 like MinIO or Backblaze B2; leave it
# unset for AWS S3). Without a scheme, https:// is assumed. A custom endpoint
# uses path-style addressing.
# endpoint = "minio.example.com:9000"

# S3 bucket name (required)
# bucket = "alps-certs"

# S3 credentials (optional). Without both, the AWS SDK's default credentials
# are used (environment, shared config files, or an IAM role).
# access_key = "your-access-key"
# secret_key = "your-secret-key"

# S3 region (optional; with a custom endpoint the default is "us-east-1",
# otherwise the AWS SDK's own region setting applies)
# region = "us-east-1"

# Folder in the bucket for certificate storage (default: "", the bucket
# root). "alps" and "alps/" both store the certificates under alps/.
# prefix = "alps/"


[cluster]
# Enable it whenever several ALPS nodes serve one site. Through it, the nodes
# share sign-in rate-limit events and tell each other when an account enrols a
# security key. With Let's Encrypt, only the leader requests certificates.
# Without it, each node keeps its own rate-limit counts. See docs/CLUSTER.md.
# Notes when enabled:
#  - TLS letsencrypt storage_provider must be "s3" (enforced at startup);
#    file storage is node-local and cannot be shared across the cluster.
#  - A cluster initialization failure is fatal. Nodes do NOT silently fall
#    back to single-node mode, since an ungated node would issue Let's
#    Encrypt certificates on its own.
#  - Nodes that keep the same version can be restarted one at a time. A new
#    version is not rolled out node by node: upgrade every node together,
#    draining and stopping the nodes running the old version before any node
#    of the new version serves. Nodes of different versions side by side are
#    not supported. The order in which the nodes start does not matter: the
#    node with the lexicographically smallest node_id takes leadership
#    whenever it joins. docs/CLUSTER.md (section 3, "Restarting and
#    Upgrading") has the details.
enabled = false
# node_id: unique within the cluster (default: the host name). The node with
# the lexicographically smallest node_id is the leader.
# node_id = "node-1"
# bind = "0.0.0.0"                              # An IPv4 address, as "IP:port" or just "IP" (default: 0.0.0.0)
# port = 7946                                    # Gossip port, used if not specified in bind (default: 7946)
#
# secret_key: required when the cluster is enabled. It encrypts and
# authenticates the gossip between nodes, so that only nodes holding the key
# take part in the shared rate-limit counts, the security-key notices and the
# choice of leader. Keep it secret, and the same on every node. Startup fails
# without it unless allow_insecure = true is set explicitly, for a fully
# private network. The value must be standard base64 of exactly 32 bytes;
# anything else stops startup. The environment variable CLUSTER_SECRET_KEY,
# when set, takes precedence over secret_key, which keeps the key out of the
# config file.
# secret_key = "base64-encoded-32-byte-key"    # Generate: openssl rand -base64 32
# allow_insecure = false                        # Set true to permit keyless (unencrypted) gossip
#
# peers: the gossip addresses (host:port) of the other nodes. They are used to
# join the cluster at startup and, every 30 seconds while this node sees no
# other member, to join it again. Client-address detection behind proxies
# depends only on [server] trusted_proxies.
# peers = ["node2:7946", "node3:7946"]


[provider]
# Mail provider type (default: "imap")
# Options: "imap", "maildir", "multi"
# A matching [provider.<type>] section is required. Any other value stops
# startup.
type = "imap"

# Provider timeout in seconds (default: 30)
# It bounds connecting to the IMAP server (the TCP connect, plus the TLS
# handshake for imaps://) and the wait for each of the server's answers: the
# greeting, LOGIN and every later command. A fetched message, or a part of
# one, has a fixed 5 minutes to arrive instead. ALPS's own waits for the
# answers to ENABLE (CONDSTORE), IDLE and DONE, NOTIFY, the STATUS after an
# IDLE, and the STATUS and UID lookup around saving a message without UIDPLUS
# use the same limit. An answer that does not come in time loses the
# connection.
# A mail operation runs until its request is cancelled: the page stops waiting
# (25 seconds by default), the page goes away, or read_timeout_sec passes. It
# may then run up to 10 more seconds. After that, the session's mail
# connection is closed once the command in flight returns, and the next
# request opens a new one.
# For the imap provider, [server] imap_timeout_sec is read in its place when
# this key is unset. With type = "multi", only this key applies, to every
# backend (30 seconds without it), and the DNS lookups for template and
# autodiscover routing are capped at 5 seconds, or at timeout_sec when it is
# lower. The maildir provider has no network timeout.
# timeout_sec = 30

[provider.imap]
# IMAP server URL (required, with a scheme)
# Supported schemes: imaps:// (implicit TLS, default port 993),
# imap:// (default port 143, requires STARTTLS), imap+insecure:// (implies
# insecure)
server = "imaps://imap.migadu.com:993"

# Allow insecure connections (default: false)
# insecure = true (like imap+insecure://) connects in plaintext without
# STARTTLS. It has no effect on imaps://, and it never disables certificate
# verification: certificates are always verified, for imaps:// and STARTTLS
# alike.
# insecure = false

# Log the IMAP protocol exchange for this provider (default: false), through
# [logging] at debug level, so only with level = "debug" there.
# OR-ed with [server] debug. Dumps message content, so keep it off in production.
# debug = false

# Authserv-ids of the receiving mail servers whose Authentication-Results
# header is trusted for a message's DMARC verdict, which decides whether a
# sender's BIMI logo is shown (default: empty, meaning the topmost header).
# Set it when your mail server stamps Authentication-Results: without it, a
# message the server did not stamp is judged by a header its sender wrote.
# authserv_ids = ["mx.example.com"]

# Maildir Provider Configuration (Local filesystem)
# [provider.maildir]
# Path to the Dovecot-style passwd file for authentication (REQUIRED)
# auth_passwd_file = "/etc/dovecot/users"
#
# Each user's own maildir, as a pattern (optional). After the placeholders are
# replaced, the path is the user's maildir itself: the directory that holds
# cur, new, tmp, the .Folder directories and alps_store.json. Placeholders:
# %u (local part of the login), %d (domain), %n (the whole login); for a login
# without "@", %u and %n are the whole login and %d is empty. Include %n, or
# %u with %d, so that every account gets its own directory: with no
# placeholder all accounts share one maildir, and with %u alone
# john@example.com and john@example.org do. When unset, each user's maildir is
# <home>/Maildir, with <home> from the user's entry in auth_passwd_file.
# See docs/MAILDIR.md.
# path = "/var/vmail/%d/%u/Maildir"

# Multi-Provider Configuration
# Routes each login to a backend chosen by the domain in the username.
# Requires type = "multi" in [provider] above.
#
# The rules are tried in this order, and the first that matches wins:
#   1. [provider.multi.domains."d"]  an entry naming that exact domain
#   2. [[provider.multi.routes]]     an entry whose domains list contains it
#   3. template                      if the domain is in template_domains
#   4. autodiscover                  if the domain is in autodiscover_domains
#   5. [provider.multi.default]      everything else
#
# A domain outside an allowlist is not an error: that rule simply does not
# match and the next one is tried. A rule that DOES match and then fails
# returns its error rather than quietly handing the user to another backend.
# [provider.multi]
# Default domain assumed if a user logs in with a bare username (without @domain).
# The user still signs in as the bare username; username@default_domain is the
# address messages are sent from and meetings are organized from.
# default_domain = "example.com"
#
# Server URL template with %d (domain), %u (local part), and %n (full username)
# placeholders for dynamic per-domain hostnames. The domain is validated per
# RFC 1035. The local part is validated only when the template interpolates it,
# and rejects what would re-point the URL -- ":/?#@[]\%", controls and spaces --
# so a few RFC-legal addresses cannot be used with a %u or %n template.
# template = "imaps://mail.%d:993"
#
# Domain allowlist for the template. Required when template is set: an unlisted
# domain never matches and falls through to the next rule.
# template_domains = ["example.com", "otherdomain.org"]
#
# Automatically discover the IMAP server using RFC 6186 DNS SRV records
# (_imaps._tcp, then _imap._tcp). An explicit domain allowlist is required, so
# that ALPS looks up and connects to the servers of the domains you list only.
# Each node keeps the answers in memory: a server found is used for 15
# minutes, and a lookup that found none is answered from the cache for 30
# seconds, failing the sign-ins for that domain until it is tried again.
# autodiscover = false
# autodiscover_domains = ["example.com", "otherdomain.org"]
#
# Either allowlist accepts the single entry "*" to match every domain. ALPS
# then connects to whatever server the domain typed at sign-in leads to, so
# use it only where the sign-in page is open to users you know. Loopback,
# private, link-local, CGNAT and the other reserved addresses that the
# remote-content proxy refuses stay blocked either way (see
# docs/OPERATIONS.md, "The Address Check").
#
# Explicit per-domain provider mappings. Alongside the mail store, a backend
# may name the other endpoints its users should reach: smtp, carddav, caldav
# and managesieve, plus a password sub-table that replaces the options in
# plugin.password. Anything a backend does not name falls back to the matching
# global setting, so a backend never inherits an endpoint from another one.
# Logins routed by template or autodiscover, and every domain that falls
# through to the default, use the smtp, carddav, caldav, managesieve and
# password settings of [provider.multi.default]. Where the default names none,
# the global settings apply.
# [provider.multi.domains."migadu.com"]
# type = "imap"
# server = "imaps://imap.migadu.com:993"
# smtp = "smtps://smtp.migadu.com:465"
#
# [provider.multi.domains."local.lan"]
# type = "maildir"
# auth_passwd_file = "/etc/dovecot/users"
#
# Grouped routes for multiple domains sharing backend settings:
# [[provider.multi.routes]]
# domains = ["domain1.com", "domain2.com"]
# type = "imap"
# server = "imaps://imap.sharedmail.com:993"
# smtp = "smtps://smtp.sharedmail.com:465"
# carddav = "https://dav.sharedmail.com"
# caldav = "https://dav.sharedmail.com"
# managesieve = "managesieves://imap.sharedmail.com:4190"
#
# Password changes for those domains, replacing the options in plugin.password.
# The block replaces [plugin.password.options] as a whole: nothing is merged,
# the global payload_mapping included. Give it its own payload_mapping (or a
# command); without one, an empty JSON object (or an empty form) is sent.
# [plugin.password] enabled = true is still required.
# In TOML this sub-table binds to the route declared ABOVE it, so keep each one
# directly under its own [[provider.multi.routes]]. A domains entry takes the
# same sub-table, as [provider.multi.domains."d".password].
# [provider.multi.routes.password]
# endpoint = "https://admin.sharedmail.com/api/webmail/mailboxes"
# method = "POST"
# auth_type = "basic"
# username = "..."
# password = "..."
# payload = "json"
# [provider.multi.routes.password.payload_mapping]
# password = "new_password"
#
# Default fallback provider for domains not matched above:
# [provider.multi.default]
# type = "imap"
# server = "imaps://imap.fallback.com:993"
# smtp = "smtps://smtp.fallback.com:465"

[smtp]
# SMTP server (required, also with [provider] type = "multi")
# Supported schemes: smtps:// (implicit TLS, default port 465), smtp://
# (default port 587, requires STARTTLS), smtp+insecure:// (implies insecure)
server = "smtps://smtp.migadu.com:465"

# Allow insecure connections (default: false)
# insecure = true (like smtp+insecure://) sends in plaintext without STARTTLS.
# It is ignored for smtps://, and it never disables certificate verification.
# It also applies to every SMTP server a multi backend names.
# insecure = false


# Plugin Configuration
# Each plugin can have its own section with enabled flag and settings.
# base always loads. A section with enabled = false keeps its plugin out, even
# when it sets a server. A section that leaves enabled out (other than
# [plugin.password]) sets its plugin up as enabled = true would, but only
# enabled = true puts a plugin on the allow-list: if any [plugin.*] section has enabled = true, only base and the
# plugins with enabled = true load. If none has, which includes having no
# [plugin.*] sections at all, every plugin that is set up loads unless its
# section says enabled = false: gpg, and caldav, carddav and managesieve when
# a section or a [provider.multi] backend gives them what they need (see
# docs/CONFIGURATION.md, section 9). The password plugin loads only with
# [plugin.password] enabled = true (and an endpoint or command, see below),
# so the allow-list applies whenever it loads.
# A caldav or carddav section with no server, as below, still loads: users
# whose multi backend names no endpoint then set up their own server in
# Settings, and see Calendar and Tasks, or Contacts, once they have one. A
# managesieve section with no server, as below, loads only when a multi
# backend names a managesieve endpoint; otherwise startup logs
# "ManageSieve enabled without a server or routed endpoint; plugin disabled".
# A server value that cannot be used (an unknown scheme, a host and port
# without a scheme, a CardDAV server without a scheme) stops startup, even in
# a section with enabled = false. See docs/PLUGINS.md and
# docs/CONFIGURATION.md (section 9).
# Only [plugin.caldav] and [plugin.password] read options.

[plugin.base]
# Base plugin provides core email functionality (required)
enabled = true


[plugin.caldav]
# CalDAV plugin for calendar support. See docs/CDAV.md.
enabled = true
# The default CalDAV server: a URL (caldavs:// or https:// for TLS;
# caldav+insecure://, http+insecure:// or http:// for plain HTTP), or a bare
# host name with no scheme, port or path. A bare host makes ALPS look up the
# CalDAV server in DNS (SRV _caldavs._tcp) once, at startup; if that fails,
# the plugin loads without a default. A value that is neither, such as a host
# and port without a scheme, stops startup. A user with no default (this
# server, or a caldav endpoint from their multi backend) sets up a server of
# their own under Settings > Calendar; any user may also enter a personal
# server there, or a separate username and password for the default. Personal
# servers are reached over HTTPS only, at public addresses only, unless
# [server] dav_allow_private_servers = true.
# server = "https://caldav.example.com"

# Plugin-specific options (optional map)
# Options:
#   week_start (alias first_day_of_week): day that starts the week in the
#   calendar UI: 0, "0", "sunday" or "sun" for Sunday; 1, "1", "monday" or
#   "mon" for Monday (case-insensitive). Any other value means Monday.
#   Default: 1. When both keys are set, week_start is used. It applies only
#   to users who have not chosen their own first day of the week.
# options = { week_start = 0 }


[plugin.carddav]
# CardDAV plugin for contacts support. See docs/CDAV.md.
enabled = true
# The default CardDAV server URL, with a scheme: carddavs:// or https:// for
# TLS, or carddav+insecure://, http+insecure:// or http:// for plain HTTP.
# There is no discovery: a value without a scheme, or with another scheme,
# stops startup. A user with no default (this server, or a carddav endpoint
# from their multi backend) sets up a server of their own under Settings >
# Contacts; any user may also enter a personal server there, or a separate
# username and password for the default. Personal servers are reached over
# HTTPS only, at public addresses only, unless [server]
# dav_allow_private_servers = true.
# server = "https://carddav.example.com"


[plugin.managesieve]
# ManageSieve plugin for email filtering. See docs/FILTERS.md.
enabled = true
# ManageSieve server. There is no discovery: without it, the plugin does not
# load unless a multi backend names managesieve, and then users whose backend
# names none find filters unavailable (logged as "ManageSieve server is not
# configured").
# Supported forms: managesieves://, managesieve://, sieve:// and a bare host
# name, all on port 4190 by default, plus managesieve+insecure:// and
# sieve+insecure://. None of them is implicit TLS.
# TLS is required: the connection must be upgraded via STARTTLS before the
# account password is sent. If the server does not offer STARTTLS the connection
# is refused. Use managesieve+insecure:// or sieve+insecure:// only for a
# trusted/local server without TLS — it permits cleartext authentication and
# skips certificate verification.
# server = "managesieves://sieve.example.com:4190"


[plugin.gpg]
# GPG End-to-End Encryption plugin. See docs/GPG.md.
enabled = true


# Password Change Configuration
# Allows users to change their password via an external HTTP API, or a command
# run on this host. The request, or the command, must finish within 15
# seconds. See docs/PASSWORD_CHANGE.md.
[plugin.password]
# Enable the password change feature (default: false)
# With enabled = true, an options block that cannot run (endpoint and command
# both set, a program path that is not absolute, ...) stops startup. The
# plugin also needs an endpoint or command below, or a provider.multi backend
# whose password block sets one. Without any, it stays off and startup logs
# "password: enabled without an endpoint, command or routed backend; plugin
# disabled".
enabled = false

[plugin.password.options]
# Endpoint URL to send the password change request to.
# Supports interpolation variables, each path-escaped: {email} (the login as
# the user signed in with it, so a bare user name under a multi
# default_domain stays bare), {local} (the part before "@", or the whole
# login) and {domain} (the part after "@", or empty).
# endpoint = "https://api.example.com/users/{local}/password"

# HTTP method to use (default: POST)
# method = "POST"

# Authentication type for the upstream request
# Options: "none", "basic", "bearer" (default: "none")
# auth_type = "basic"

# Username and password for basic authentication
# username = "admin"
# password = "supersecretpassword"

# Token for bearer authentication
# token = "your_bearer_token"

# Payload format for the request body
# Options: "json", "form" (default: "json")
# payload = "json"

# Or, in place of endpoint, a program to run: an absolute path, then each
# argument. It runs without a shell. Arguments support {email}, {local} and
# {domain}; the passwords reach it on stdin only. See docs/PASSWORD_CHANGE.md.
# command = ["/usr/local/bin/maddy", "creds", "password", "{email}"]
# What the program reads on stdin (default: the new password and a newline).
# Supports {old_password} and {new_password} besides the above.
# stdin = "{new_password}\n"

# Payload Mapping Configuration (optional, used only with endpoint)
# Maps internal ALPS variables to custom payload fields expected by the endpoint.
# Each key is the field name sent, and each value is one of the internal
# variables: "username" (the login, as {email} above), "local", "domain",
# "old_password", "new_password". An entry naming any other value is dropped.
# Only the fields mapped here will be sent in the request payload. Without this
# table, an empty JSON object (or an empty form) is sent. It plays no part with
# command.
[plugin.password.options.payload_mapping]
old_password = "old_password"
password = "new_password"
domain = "domain"
