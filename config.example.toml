# Alps Configuration File Example

[server]
# Server listening address
addr = ":1323"

# Enable debug logging
debug = true

# Trust X-Forwarded-For, X-Real-IP, X-Forwarded-Proto and X-Forwarded-Host headers
# from specific proxy IPs or CIDR blocks.
# ONLY enable this if ALPS is deployed behind a trusted reverse proxy (like Nginx or HAProxy)
# If enabled with untrusted IPs, attackers can spoof their IP address to bypass rate limits.
# When the immediate peer is listed here, ALPS also uses X-Forwarded-Proto/X-Forwarded-Host
# to compute the expected Origin for the CSRF check. This is the recommended way to run ALPS
# behind a TLS-terminating reverse proxy (proxy speaks HTTPS to the browser, HTTP to ALPS).
# trusted_proxies = ["127.0.0.1/32", "::1/128", "10.0.0.0/8"]

# Additional origins accepted by the CSRF check, in addition to the one ALPS computes
# from the request (or from the forwarded headers above). Use this when your proxy does
# not (or cannot) set X-Forwarded-Proto/Host, or as an explicit override. The browser's
# Origin header must match one of these exactly (scheme + host [+ port]).
# trusted_origins = ["https://webmail.example.com"]

# Fernet key for login persistence (optional)
# Encrypts user credentials in browser cookies to enable "remember me" functionality
# and session restoration after server restarts.
# Generate with: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# login_key = "your-fernet-key-here"
#
# Security note: Rotating the login_key will force all users to re-login.
# This is a security feature - use it to invalidate all persisted credentials
# during security incidents or when you suspect credential compromise.

# Temporary directory for file uploads and processing (optional)
# Uses OS default temp directory if not specified
# temp_dir = "/tmp/alps"

# Session duration in minutes (default: 30)
# Controls how long user sessions remain active without activity
# session_minutes = 30

# Maximum session duration in minutes (default: 1440, i.e., 24 hours)
# Caps the maximum session duration even if user sets a higher auto-logout preference
# max_session_minutes = 1440

# HTTP Server Timeouts
# Protects against slow client attacks and resource exhaustion

# HTTP read timeout in seconds (default: 10)
# Maximum time allowed to read the entire HTTP request (headers + body)
# Includes time from connection accept to end of request body read
read_timeout_sec = 10

# HTTP write timeout in seconds (default: 30)
# Maximum time allowed to write the HTTP response
# Should be high enough for large email attachments to be uploaded/downloaded
write_timeout_sec = 30

# HTTP idle timeout in seconds (default: 120)
# Maximum time to wait for the next request when using HTTP keep-alive connections
# Applies between requests, not during active transfers
idle_timeout_sec = 120

# IMAP operation timeout in seconds (default: 30)
# Connection establishment timeout for the IMAP server (default: 30)
# This strictly governs the initial TCP handshake and login to the IMAP server.
# Note: Actual IMAP operations (fetch, search, etc.) are effectively timed out 
# by the HTTP server's write_timeout_sec when the client connection drops.
imap_timeout_sec = 30

# SMTP operation timeout in seconds (default: 30)
# This is a true operation timeout passed directly to the SMTP client.
# It prevents indefinite blocking on stuck SMTP operations (connect, send, etc.)
smtp_timeout_sec = 30

# Example configurations for different deployment scenarios:
#
# Fast network, small mailboxes:
#   read_timeout_sec = 5
#   write_timeout_sec = 15
#   imap_timeout_sec = 15
#   smtp_timeout_sec = 15
#
# Standard (recommended for most deployments):
#   read_timeout_sec = 10
#   write_timeout_sec = 30
#   imap_timeout_sec = 30
#   smtp_timeout_sec = 30
#
# Slow network or large attachments:
#   read_timeout_sec = 30
#   write_timeout_sec = 120
#   imap_timeout_sec = 60
#   smtp_timeout_sec = 60

# Session Limits
# Controls the maximum number of concurrent sessions to prevent memory exhaustion attacks
# and resource abuse

# Maximum total concurrent sessions globally (default: 10000)
# Set to 0 for unlimited sessions (not recommended)
# When limit is reached, oldest sessions are evicted (LRU policy)
max_sessions = 10000

# Maximum concurrent sessions per user (default: 10)
# Set to 0 for unlimited sessions per user (not recommended)
# Prevents a single user or compromised account from creating excessive sessions
# When limit is reached, oldest user sessions are evicted (LRU policy)
max_sessions_per_user = 10

# Example configurations for different deployment sizes:
#
# Small deployment (< 100 users):
#   max_sessions = 1000
#   max_sessions_per_user = 5
#
# Medium deployment (100-1000 users):
#   max_sessions = 10000
#   max_sessions_per_user = 10
#
# Large deployment (> 1000 users):
#   max_sessions = 50000
#   max_sessions_per_user = 20

# Max attachment size per composer in MiB (default: 32)
# Limits the size of a single email being composed
# max_attachment_mib = 32

# Max attachment size per session in MiB (default: 128)
# Limits the total size of attachments uploaded across all active composers in a session
# max_session_attachment_mib = 128

# Max global attachment size in MiB (default: 1024)
# Limits the total size of attachments stored on the server across all users
# max_global_attachment_mib = 1024

# Rate Limiting Configuration
# Protects the login endpoint from brute force attacks and abuse
[server.rate_limit]
# Enable rate limiting (default: true)
# Set to false to disable all rate limiting (not recommended for production)
enabled = true

# Per-IP rate limits
# Maximum login attempts from a single IP address per minute
ip_requests_per_minute = 5

# Maximum login attempts from a single IP address per hour
# If exceeded, IP is locked out for the duration specified in lockout_minutes
ip_requests_per_hour = 20

# Per-username rate limits
# Maximum failed login attempts for a specific username per 15 minutes
username_fails_per_quarter = 5

# Maximum failed login attempts for a specific username per hour
# If exceeded, username is locked out for the duration specified in lockout_minutes
username_fails_per_hour = 10

# Global rate limit
# Maximum login requests across all users and IPs per second
# Protects server resources during large-scale attacks
global_requests_per_second = 100

# Lockout duration in minutes (default: 15)
# How long an IP or username is blocked after hitting rate limits
lockout_minutes = 15

# Example configurations for different security postures:
#
# Strict (high security, may impact legitimate users):
#   ip_requests_per_minute = 3
#   ip_requests_per_hour = 10
#   username_fails_per_quarter = 3
#   username_fails_per_hour = 5
#   lockout_minutes = 30
#
# Standard (balanced, recommended for most deployments):
#   ip_requests_per_minute = 5
#   ip_requests_per_hour = 20
#   username_fails_per_quarter = 5
#   username_fails_per_hour = 10
#   lockout_minutes = 15
#
# Relaxed (lower security, better user experience):
#   ip_requests_per_minute = 10
#   ip_requests_per_hour = 40
#   username_fails_per_quarter = 10
#   username_fails_per_hour = 20
#   lockout_minutes = 5


[cache]
# Cache time-to-live in minutes (default: 10)
# How long cached data stays valid before expiring
ttl_minutes = 10

# Enable caching (default: true)
# Set to false to disable all caching (not recommended)
enabled = true

[logging]
# Log output destination
# Options:
#   "stdout"  - Write logs to standard output
#   "stderr"  - Write logs to standard error (default)
#   "syslog"  - Send logs to system syslog daemon
#   "/path/to/file.log" - Write logs to a file (path can be absolute or relative)
#
# Examples:
#   output = "stdout"
#   output = "stderr"
#   output = "syslog"
#   output = "/var/log/alps/alps.log"
#   output = "./logs/alps.log"
output = "stderr"

# Log format
# Options:
#   "json"    - Structured JSON logs for machine parsing (default for production)
#   "console" - Human-readable text format (default when debug=true)
#
# JSON example output:
#   {"time":"2025-10-21T10:30:45Z","level":"INFO","msg":"Starting server on :1323"}
# Console example output:
#   time=2025-10-21T10:30:45.000Z level=INFO msg="Starting server on :1323"
format = "console"

# Log level
# Options:
#   "debug" - Most verbose, includes all log messages
#   "info"  - Standard operational messages (default for production)
#   "warn"  - Warning messages only
#   "error" - Error messages only (least verbose)
#
# Note: When server.debug=true, the level defaults to "debug"
level = "info"

[webauthn]
# WebAuthn Configuration for Two-Factor Authentication (2FA)
# Required for WebAuthn to work in production environments

# The Relying Party ID (usually your domain name)
# rpid = "webmail.example.com"

# The display name shown to users during authentication
# display_name = "Alps Webmail"

# Allowed origins for WebAuthn requests
# Must include the exact scheme (https://) and no trailing slash
# origins = ["https://webmail.example.com"]


[tls]
# Enable TLS termination (default: false)
# enabled = false

# TLS Provider ("file" or "letsencrypt")
# provider = "file"

# Path to TLS certificate (required if provider="file")
# cert_file = "/path/to/cert.pem"

# Path to TLS private key (required if provider="file")
# key_file = "/path/to/key.pem"

[tls.letsencrypt]
# Email address for ACME registration (required)
# email = "admin@example.com"

# Domains to obtain certificates for (required)
# domains = ["mail.example.com", "webmail.example.com"]

# Default domain for SNI-less connections (optional)
# default_domain = "mail.example.com"

# Storage provider for certificates (default: "s3")
# storage_provider = "s3"

# Local cache directory for certificates (default: "cert-cache")
# Used as fallback cache when using s3, or as main cache when using file provider
# cache_dir = "cert-cache"

# Sync interval in minutes for S3 fallback cache (default: 5)
# sync_interval_minutes = 5

# Address for HTTP-01 challenge handler (default: ":80")
# Change this if running behind a proxy that already uses port 80.
# Your proxy should forward /.well-known/acme-challenge/* to this address.
# acme_http_addr = ":8080"

# ACME directory URL (default: Let's Encrypt production).
# Set to the Let's Encrypt staging directory to test certificate issuance
# without burning production rate limits:
#   directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"
# When a non-production directory is configured, the local cache directory and
# S3 prefix are automatically namespaced (suffix derived from the URL) so
# staging certificates can never be served from, or overwrite, the production
# certificate store.
# directory_url = ""

# Also pre-issue the legacy RSA certificate flavor alongside ECDSA
# (default: false). Only needed if you must support very old clients that
# cannot do ECDSA; doubles the number of certificates issued per domain.
# Upgrade note: deployments whose cached certificates are RSA-only (issued
# historically by handshakes from non-ECDSA clients) will obtain one new
# ECDSA certificate per domain on the first warm pass after upgrading.
# warm_rsa_certs = false

[tls.letsencrypt.s3]
# S3 storage configuration for certificates
# Uses autocert with S3 storage as the primary source of truth.

# S3 endpoint (required if using custom S3 like MinIO or Backblaze B2)
# endpoint = "s3.amazonaws.com"

# S3 bucket name (required)
# bucket = "alps-certs"

# S3 credentials (optional - uses IAM if not specified)
# access_key = "your-access-key"
# secret_key = "your-secret-key"

# S3 region (optional)
# region = "us-east-1"

# Key prefix for certificate storage (default: "")
# prefix = "alps/"


[cluster]
# Optional - only needed for Let's Encrypt with S3 storage and multiple ALPS nodes.
# Notes when enabled:
#  - TLS letsencrypt storage_provider must be "s3" (enforced at startup);
#    file storage is node-local and cannot be shared across the cluster.
#  - A cluster initialization failure is fatal. Nodes do NOT silently fall
#    back to single-node mode, since an ungated node would issue Let's
#    Encrypt certificates on its own.
#  - When deploying new versions, restart the current cluster leader first
#    (leadership is pinned to the lexicographically smallest node_id).
enabled = false
# node_id = "node-1"                            # Unique identifier for this node
# bind = "0.0.0.0"                              # Can be "IP:port" or just "IP" (default: 0.0.0.0)
# port = 7946                                    # Gossip port, used if not specified in bind (default: 7946)
# secret_key = "base64-encoded-32-byte-key"    # Generate: openssl rand -base64 32
# A secret_key is REQUIRED: without it, gossip is unencrypted and unauthenticated,
# letting anyone with reach of the gossip port forge rate-limit events (lock out or
# unlock arbitrary accounts) and hijack leader election. To run without encryption on
# a fully trusted/private network, you must explicitly opt in:
# allow_insecure = false                        # Set true to permit keyless (insecure) gossip
# peers = ["node2:7946", "node3:7946"]           # List ALL internal peers so right-to-left XFF and rejoin work


[provider]
# Mail provider type (default: "imap")
# Options: "imap", "jmap" (future)
type = "imap"

# Provider-specific options (optional map)
# options = { "example_key" = "example_value" }

[provider.imap]
# IMAP server URL
server = "imaps://imap.migadu.com:993"

# Allow insecure connections (default: false)
# insecure = false

# Maildir Provider Configuration (Local filesystem)
# [provider.maildir]
# Path to the base maildir directory for all users
# path = "/var/mail/virtual"
#
# Path to the Dovecot-style passwd file for authentication
# auth_passwd_file = "/etc/dovecot/users"

[smtp]
# SMTP server
# Supported schemes: smtps://, smtp://, smtp+insecure://
server = "smtps://smtp.migadu.com:465"

# Allow insecure connections (default: false)
# insecure = false


# Plugin Configuration
# Each plugin can have its own section with enabled flag and settings
# If no [plugin.*] sections are defined, all plugins are enabled by default

[plugin.base]
# Base plugin provides core email functionality (required)
enabled = true

# Plugin-specific options (optional map)
# options = { "example_key" = "example_value" }


[plugin.caldav]
# CalDAV plugin for calendar support
enabled = true
# CalDAV server URL (optional, can use auto-discovery)
# Supported schemes: caldavs://, caldav+insecure://, https://, http+insecure://
# server = "https://caldav.example.com"

# Plugin-specific options (optional map)
# options = { "example_key" = "example_value" }


[plugin.carddav]
# CardDAV plugin for contacts support
enabled = true
# CardDAV server URL (optional, can use auto-discovery)
# Supported schemes: carddavs://, carddav+insecure://, https://, http+insecure://
# server = "https://carddav.example.com"

# Plugin-specific options (optional map)
# options = { "example_key" = "example_value" }


[plugin.managesieve]
# ManageSieve plugin for email filtering
enabled = true
# ManageSieve server URL (optional, can use auto-discovery via SRV records)
# Supported schemes: managesieves://, managesieve://, sieve://, managesieve+insecure://
# TLS is required: the connection must be upgraded via STARTTLS before the
# account password is sent. If the server does not offer STARTTLS the connection
# is refused. Use managesieve+insecure:// only for a trusted/local server without
# TLS — it permits cleartext authentication and skips certificate verification.
# server = "managesieves://sieve.example.com:4190"


[plugin.gpg]
# GPG End-to-End Encryption plugin
enabled = true


# Password Change Configuration
# Allows users to change their password via an external HTTP API
[plugin.password]
# Enable the password change feature (default: false)
enabled = false

[plugin.password.options]
# Endpoint URL to send the password change request to.
# Supports interpolation variables: {email}, {local}, {domain}
# endpoint = "https://api.example.com/users/{local}/password"

# HTTP method to use (default: POST)
# method = "POST"

# Authentication type for the upstream request
# Options: "none", "basic", "bearer" (default: "none")
# auth_type = "basic"

# Username and password for basic authentication
# username = "admin"
# password = "supersecretpassword"

# Token for bearer authentication
# token = "your_bearer_token"

# Payload format for the request body
# Options: "json", "form" (default: "json")
# payload = "json"

# Payload Mapping Configuration (Required)
# Maps internal ALPS variables to custom payload fields expected by the endpoint.
# Internal variables available: "username", "local", "domain", "old_password", "new_password"
# Only the fields mapped here will be sent in the request payload.
[plugin.password.options.payload_mapping]
old_password = "old_password"
password = "new_password"
domain = "domain"
